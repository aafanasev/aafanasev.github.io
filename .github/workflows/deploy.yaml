name: Deploy Hugo

on:
  push:
    branches:
      - master
    paths:
      - "_hugo/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"
          extended: true
      - name: Run hugo build
        run: |
          cd _hugo
          hugo --minify
        env:
          HUGO_ENVIRONMENT: production
      - name: Move build output to root dir
        run: cp -rv ./_hugo/public/* ./
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Hugo
          labels: auto-deploy, hugo
          branch: hugo
          branch-suffix: timestamp
